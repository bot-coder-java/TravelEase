<!DOCTYPE html>
<html lang="en">
<head>
  <title>Complete Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2 class="logo">TravelEase</h2>
</header>

<section class="hero">
  <h1>Complete Your Booking</h1>
</section>

<section class="services">
  <div class="card">
    <h2>Passenger Details</h2>

    <form>
      <input type="text" placeholder="Full Name" required><br><br>
      <input type="email" placeholder="Email Address" required><br><br>
      <input type="text" placeholder="Mobile Number" required><br><br>
      <input type="date" required><br><br>

      <button class="btn">Confirm Booking</button>
    </form>
  </div>
</section>

</body>
</html>
